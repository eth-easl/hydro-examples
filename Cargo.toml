[package]
name = "hydro-examples"
publish = false
version = "0.0.0"
edition = "2024"

[dependencies]
hydro_lang = { path = "../hydro_SP/hydro_lang"}
stageleft = "*"
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"

[build-dependencies]
stageleft_tool = "*"

[dev-dependencies]
hydro_deploy = { path = "../hydro_SP/hydro_deploy/core" }
hydro_lang = { path = "../hydro_SP/hydro_lang", features = [
    "deploy",
    "knative_deploy",
    # Current Hydro deploy code needs tempfile, enabled by its sim feature.
    "sim",
] }

[lints.clippy]
uninlined_format_args = "allow"
